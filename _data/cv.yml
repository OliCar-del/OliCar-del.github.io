  - title: Profile
    text: >-
      Hands-on electrical engineering graduate (University of Queensland, 2025) who builds and tests real
      hardware - power systems, battery and solar charge-control electronics, instrumentation and data-logging -
      and is happy on the tools, in the workshop and out on site. Backed by field experience with precision
      equipment, a strong safety record, and years of running my own practical businesses. I'm keen to make a
      hands-on start in Australia's fuel and energy-infrastructure sector and to be useful across whatever the
      work needs - field and site support, electrical, instrumentation, or fuel-management systems. Reliable,
      quick to learn, and eager to take on practical challenges.

