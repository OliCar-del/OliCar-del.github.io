<!-- SECTION 3: project -->
<section id="projects" class="project-grid-section">
    <h2>Projects</h2>

    <div class="grid-container">
        {%- for item in site.projects %}
        <a href="{{ item.url | relative_url }}" class="project-link">
            <div class="project-card">
                <img src="{{ item.thumb | default: item.image | relative_url }}" alt=""{% if forloop.index > 2 %} loading="lazy"{% endif %} decoding="async">
                <h3 class="project-title">{{ item.title }}</h3>
                <div class="project-skills">
                    {%- for skill in item.skills %}
                    <span class="skill">{{ skill }}</span>
                    {%- endfor %}
                </div>
                <p class="project-description">{{ item.description }}</p>
                <span class="read-more">Read more →</span>
            </div>
        </a>
        {%- endfor %}
    </div>
</section>
