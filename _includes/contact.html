<!-- SECTION 4: Contact-->
<section id="contact" class= "contact-section">
    <h2>Contact</h2>

    <div class="group">
      
        <form action="https://formspree.io/f/{{site.formspree-key}}" method="POST">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" autocomplete="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="message">Message</label>
            <textarea id="message" cols="30" rows="10" name="message" required></textarea>

            <!-- Formspree: email subject line, and a hidden field that only spam bots fill in -->
            <input type="hidden" name="_subject" value="New message from your portfolio site">
            <input type="text" name="_gotcha" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">

            <button type="submit">Send Message</button>
        </form>
    </div>
  </section>
