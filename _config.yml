# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.

# Main Page Setup

title: Oliver Carnew's Project Portfolio # This is what shows up in the tab of the browser
tagline: Graduate Electrical Engineer    # shown after the title on the home page's tab and in search results

# Site URL - required for canonical links, sitemap.xml and SEO tags
url: "https://olicar-del.github.io"
baseurl: ""
author: Oliver Carnew

# Used by jekyll-seo-tag to link this site to other profiles in structured data
social:
  name: Oliver Carnew
  links:
    - https://www.linkedin.com/in/oliver-carnew
    - https://github.com/OliCar-del



# Hero Section
name: Oliver Carnew
headline: Graduate Electrical Engineer
description: >- # dont remove this line. this will ignore all new lines until the next section
  Hands-on electrical engineering graduate (University of Queensland, 2025) who designs, builds and tests real hardware -
  power electronics and battery systems, instrumentation and data acquisition, embedded firmware and control systems.
  Projects are taken from concept to verified result: schematic capture, PCB layout, firmware, bench bring-up and
  fault-finding.

# Place your profile image in /assets/images/profile-image/folder and edit the file name
profile_image: /assets/images/profile-image/cropped_headshot.png


# Link your resume
# Keep this filename the same when you update your CV (just replace the file), so links you've
# already sent keep working. Oliver_Carnew_CV_07_26.pdf is kept only for links made before the rename.
resume-url: /assets/resume/Oliver_Carnew_CV.pdf


# Set up external links - this will show up as small icons next to your name.

external-links:    # input only your own url slug. The icons with missing entries will not appear.
  linkedin: oliver-carnew    # https://www.linkedin.com/in/oliver-carnew/
  github: OliCar-del?tab=repositories    # https://github.com/OliCar-del 
  stackoverflow:      # https://stackoverflow.com/users/{your url slug}
  medium:            # https://medium.com/@{your url slug} 
  x-twitter:   # https://x.com/{your url slug} 
  threads:            # https://threads.net/@{your url slug} 
  instagram:       # https://instagram.com/{your url slug}
  youtube:           # https://youtube.com/@{your url slug} 
  discord:            # https://discord.com/users/{your url slug} 
  bluesky:           # https://bsky.app/profile/{your url slug} 
  

# Skills Section - Add the list of your Skills by categories/tools. The indentation for each level needs to be precise.
skills:
  - category: Power & Analog Electronics
    tools:
    - Battery systems (LiFePO4 pack construction, BMS integration, protection & fusing)
    - Solar MPPT, DC-DC conversion and USB-C/USB-PD power-path design
    - Analog front ends - signal conditioning, precision current sources, input protection
    - Circuit simulation & verification (LTspice)

  - category: PCB Design & Hardware Bring-up
    tools:
    - Schematic capture & PCB layout (Altium Designer, KiCad)
    - Iterative prototyping - breadboard to revision-driven PCB spins, design-for-debug
    - Bench test & fault-finding (oscilloscope, logic analyser, multimeter)
    - SMT & through-hole assembly, soldering and rework
    - BOM management & cost engineering

  - category: Embedded Systems & Instrumentation
    tools:
    - Microcontroller firmware in C/C++ (STM32, FreeRTOS)
    - Data acquisition - ADCs, sensor integration, alarms and logging
    - Serial protocols (UART, SPI, I2C) and custom optical links
    - Real-time firmware - interrupts, timers, state machines

  - category: Control Systems
    tools:
    - PID design - anti-windup, feedforward, derivative filtering
    - Frequency-domain analysis (Bode margins, root locus, Routh-Hurwitz)
    - Dead-time compensation (Smith predictor) and relay autotuning
    - MATLAB/Simulink and real-time simulation in C

  - category: Software, Data & Machine Learning
    tools:
    - Python (NumPy, pandas, pipeline automation)
    - Large-dataset processing, statistical analysis and visualisation
    - NLP & neural ranking model evaluation (LLMs, TensorFlow)
    - SQL, JavaScript
    - Git (version control)

  - category: Engineering Practice
    tools:
    - Technical documentation & reporting
    - Verification culture - test harnesses, regression self-tests, quality assurance
    - Scrum/Agile
    - WHS and electrical safety awareness


# Contact Form Setup. Setup an account and copy over the key. When someone fills out the form, it will be received in your email.
formspree-key:   mykpoaok


# Analytics - free, privacy-friendly visit counts via GoatCounter (no cookie banner needed).
# Sign up free at goatcounter.com, pick a site code, and enter it below to enable.
# e.g. a code of "olicar" gives you a dashboard at https://olicar.goatcounter.com
goatcounter: portfold


# Site colours. Copy one of the alternative sets below over these to change the look.
colors:
  text: "#1a1c20"
  border: "#ddd"
  link: "#4a76ee"
  highlight: "#0c0cf2"
  background: "#ffffff"
  light_background: "#f3f5fb"

# Dark mode colours, used automatically when a visitor's device is set to dark.
colors_dark:
  text: "#e6e8ec"
  border: "#2c313a"
  link: "#8fb0ff"
  highlight: "#b9c9ff"
  background: "#121417"
  light_background: "#1b1f26"

# Alternative colour sets (text / border / link / highlight / background / light_background):
#   mint:  "#2c3333" "#e0f2ef" "#40b3a2" "#2a9d8f" "#f7fbfa" "#f0f9f7"
#   lemon: "#2d2926" "#f7f3e3" "#ffc94d" "#ffb800" "#fffdf5" "#fff9e6"
#   pink:  "#2d2d2d" "#f8e2e2" "#ff8fa3" "#ff4d6d" "#fff8f8" "#fff5f6"






#########################################################################################################
# Build settings for the site. Editing the below may cause the site to malfunction.

# The site has its own layouts; this stops GitHub Pages adding its default theme's unused stylesheet.
theme: null

collections:
  projects:
    output: true
    # Files inside a project folder are published at /projects/<folder>/<file>.
    # Each project's page URL comes from `permalink:` in its own index.md.
    permalink: /projects/:path/


markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
      indent: 0

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Kept out of the published site. Jekyll 3 replaces its default list when this is set,
# so the Gemfiles are listed explicitly. Patterns match anywhere in the repo.
exclude:
  - Reference
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - scripts
  - vendor
  - node_modules
  - "*.pptx"
  - "*.docx"
  - "_projects/*.txt"
  - "*/.claude/*"   # tool folders (e.g. Claude Code worktrees) inside a project folder


# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
