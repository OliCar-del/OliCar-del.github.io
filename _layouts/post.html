---
layout: wrapper
---

<div class="post-view">
    <div class="summary">
        {%- if page.image %}
        <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt }}">
        {%- endif %}

        <div class="title-header">
            <h1>{{page.title}}</h1>
        </div>
        
        <p class="lead">{{ page.description }}</p>
        <div class="skills-card">
            <h2>Skills Used</h2> 
            <div class="skills-list">
                {% for skill in page.skills %}
                <span class="skill">{{ skill }}</span>    
                {% endfor %}
            </div>
        </div>
    </div>
      
    <div class="content">
        {{content}}
    </div>
</div>
