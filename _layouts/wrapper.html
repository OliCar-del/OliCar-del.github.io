<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="google-site-verification" content="wV5SB7dox_xcq6nPqWHPnxy9wVqJ6VU0CCZIVxogwUM" />

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ '/css/styles.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/css/syntax.css' | relative_url }}">

    <script src="{{ '/assets/js/script.js' | relative_url }}" defer></script>

    <!-- Regenerate with: python scripts/optimize_images.py --favicons -->
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48">
    <link rel="icon" type="image/png" href="{{ '/assets/images/favicon-32.png' | relative_url }}" sizes="32x32">
    <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

    {% seo %}

    {% if page.url == "/" %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Oliver Carnew",
      "url": "https://olicar-del.github.io/",
      "jobTitle": "Graduate Electrical Engineer",
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "The University of Queensland"
      },
      "knowsAbout": [
        "Power electronics",
        "PCB design",
        "Embedded systems",
        "Control systems",
        "Instrumentation and data acquisition"
      ],
      "sameAs": [
        "https://www.linkedin.com/in/oliver-carnew",
        "https://github.com/OliCar-del"
      ]
    }
    </script>
    {% endif %}

</head>
<body>
    <!-- NAVBAR -->
     {% include navbar.html%}

     <div class="page">{{content}}</div>

     {% include footer.html%}

    {% if site.goatcounter %}
    <script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    {% endif %}
</body>
</html>
